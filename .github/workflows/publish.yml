name: Publish image

# Builds the multi-arch image and pushes it to Docker Hub, then syncs the
# Docker Hub description from README.md.
#
# Triggers:
#   - push to main           → tag :edge (preview of latest main)
#   - push a tag vX.Y.Z      → tags :X.Y.Z, :X.Y, :X, :latest (immutable release + moving aliases)
#   - manual run             → workflow_dispatch
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  e.g. vwuilbea
#   DOCKERHUB_TOKEN     Docker Hub access token with Read/Write — used to push the image
#   DOCKERHUB_PASSWORD  account password (or a full-scope PAT if 2FA is on) — used ONLY to
#                       update the Hub description; the /v2 description API rejects plain tokens

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: vwuilbea/apache-oidc

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-build emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # :edge on main; vX.Y.Z tags produce :X.Y.Z, :X.Y, :X and (via latest=auto) :latest.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub page in sync with the repo README (main only).
      - name: Sync Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # The description API needs the account password (or a full-scope PAT), not the push token.
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE }}
          short-description: "Maintained Apache + mod_auth_openidc base image — config-free OIDC reverse-proxy / gateway"
          readme-filepath: ./README.md
